  <g font-family="Thonburi, 'Sukhumvit Set', sans-serif" fill="#E8C25A">
    <text x="90" y="170" font-size="40" fill="#F6E7B8">อี้จิง AI · ตรุษจีน ๒๕๗๐</text>
    <text x="90" y="260" font-size="76" font-weight="bold">กวาประจำปีมะแม</text>
