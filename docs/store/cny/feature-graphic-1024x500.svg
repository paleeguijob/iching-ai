<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B3261E"/>
      <stop offset="1" stop-color="#7A1410"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="500" fill="url(#bg)"/>
  <rect x="16" y="16" width="992" height="468" fill="none" stroke="#E8C25A" stroke-width="3"/>
  <rect x="26" y="26" width="972" height="448" fill="none" stroke="#E8C25A" stroke-width="1" opacity="0.6"/>
